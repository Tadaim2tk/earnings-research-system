name: ERS Level 2 Monitor

on:
  schedule:
    - cron: "17 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      source_mode:
        description: Offline fixture or authorized live target
        required: true
        type: choice
        default: offline
        options:
          - offline
          - live
      target_id:
        description: Monitor target ID
        required: true
        default: MON-EXAMPLE-CALENDAR
      fixture_name:
        description: Offline fixture name
        required: false
        type: choice
        options:
          - initial
          - same
          - changed
          - replacement
          - timeout
          - fatal
      run_id:
        description: Deterministic dry-run monitor run ID
        required: true
        default: MRUN-EXAMPLE-001
      gap_acknowledgement:
        description: JSON record created after Human review of a stale stopped checkpoint
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install -e .
      - name: Fetch committed state for planning
        # Two things are read from the same bundles. The announcement date comes
        # from the calendar target's own state, so a date the company moves does
        # not have to be retyped into the registry. The last success decides
        # whether the normal day still needs an observation, so a cron slot the
        # scheduler drops no longer costs the whole day. A missing bundle just
        # leaves the registry value and the clock in use.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          targets=$(python -c '
          import csv
          rows = list(csv.DictReader(open("data/config/monitor_targets.csv", encoding="utf-8-sig")))
          active = {
              r["monitor_target_id"]
              for r in rows
              if r["enabled"].lower() == "true"
              and r["activation_state"] == "activated"
              and r["monitoring_level"] == "level_2"
              and r["automated_access_permitted"].lower() == "true"
          }
          sources = {r["schedule_source_target_id"] for r in rows if r["schedule_source_target_id"]}
          print(" ".join(sorted(active | sources)))')
          for target in $targets; do
            # 展開は検証より先に起きる。検証が落ちた出力を残すと、planは
            # manifest を見ずに checkpoint.json を読むので、**検証されていない
            # 「今日もう成功した」が monitor ジョブを止められる。**
            # 落ちた出力は消す。読むのは成功した取得の結果だけにする。
            python -m earnings_research.cli monitor-fetch-state \
              --repository "$REPOSITORY" \
              --target-id "$target" \
              --output ".monitor/previous-state/$target" \
              || rm -rf ".monitor/previous-state/$target"
          done
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_MODE: ${{ github.event.inputs.source_mode }}
          TARGET_ID: ${{ github.event.inputs.target_id }}
          FIXTURE_NAME: ${{ github.event.inputs.fixture_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$SOURCE_MODE" = "live" ]; then
              matrix=$(python -m earnings_research.cli monitor-plan \
                data/config/monitor_targets.csv \
                --target-id "$TARGET_ID" \
                --force)
            else
              matrix=$(python -m earnings_research.cli monitor-plan \
                tests/fixtures/monitor_operations/monitor_targets.csv \
                --target-id "$TARGET_ID" \
                --fixture-name "$FIXTURE_NAME" \
                --force)
            fi
          else
            matrix=$(python -m earnings_research.cli monitor-plan \
              data/config/monitor_targets.csv \
              --previous-state .monitor/previous-state \
              --planned-at "$(date --iso-8601=seconds)")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  monitor:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ers-level2-monitor-${{ matrix.monitor_target_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install -e .
      - name: Fetch previous committed state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_ID: ${{ matrix.monitor_target_id }}
        run: |
          python -m earnings_research.cli monitor-fetch-state \
            --repository "$REPOSITORY" \
            --target-id "$TARGET_ID" \
            --output .monitor/previous
      - id: recheck
        name: Re-check dueness after the concurrency wait
        # plan は同時に走っている別の実行の結果を見られない。遅れて重なった2本が
        # どちらも「今日はまだ成功していない」を見ると両方 due になる。target ごとの
        # concurrency は順番に並べるだけなので（cancel-in-progress: false）、
        # **2本目は更新後の状態を取得しておきながら、同じ日に二度取りに行く。**
        # 待ち終わってから、いま在る状態でもう一度確かめる。
        #
        # 手動の dispatch は plan を --force で通しているので、ここでも通す。
        # 人が意図して呼んだ観測を、この門で止めない。
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGISTRY: ${{ matrix.registry }}
          TARGET_ID: ${{ matrix.monitor_target_id }}
          EVENT_DATE: ${{ matrix.event_date }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          event_date_args=()
          if [ -n "$EVENT_DATE" ]; then
            event_date_args=(--event-date "$EVENT_DATE")
          fi
          result=$(python -m earnings_research.cli monitor-recheck-due \
            --registry "$REGISTRY" \
            --target-id "$TARGET_ID" \
            --previous-dir .monitor/previous \
            --at "$(date --iso-8601=seconds)" \
            "${event_date_args[@]}")
          due=$(printf '%s' "$result" | python -c 'import json,sys; print(str(json.load(sys.stdin)["due"]).lower())')
          echo "due=$due" >> "$GITHUB_OUTPUT"
          if [ "$due" != "true" ]; then
            echo "already observed today; skipping the duplicate source request."
          fi
      - id: run-monitor
        name: Generate and validate state bundle
        if: steps.recheck.outputs.due == 'true'
        env:
          REGISTRY: ${{ matrix.registry }}
          TARGET_ID: ${{ matrix.monitor_target_id }}
          FIXTURE_NAME: ${{ matrix.fixture_name }}
          EVENT_DATE: ${{ matrix.event_date }}
          DISPATCH_RUN_ID: ${{ github.event.inputs.run_id }}
          GAP_ACKNOWLEDGEMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.gap_acknowledgement || '' }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          started_at=$(date --iso-8601=seconds)
          finished_at=$(date --iso-8601=seconds --date='+1 second')
          run_id=${DISPATCH_RUN_ID:-MRUN-${GITHUB_RUN_ID_VALUE}-${GITHUB_RUN_ATTEMPT_VALUE}}
          gap_acknowledgement_args=()
          if [ -n "$GAP_ACKNOWLEDGEMENT" ]; then
            printf '%s\n' "$GAP_ACKNOWLEDGEMENT" > .monitor/gap_acknowledgement.json
            gap_acknowledgement_args=(--gap-acknowledgement .monitor/gap_acknowledgement.json)
          fi
          if [ "${{ matrix.source_mode }}" = "live" ]; then
            result=$(python -m earnings_research.cli monitor-run-live \
              --registry "$REGISTRY" \
              --target-id "$TARGET_ID" \
              --previous-dir .monitor/previous \
              --output .monitor/current \
              --run-id "$run_id" \
              --started-at "$started_at" \
              --finished-at "$finished_at" \
              --event-date "$EVENT_DATE" \
              "${gap_acknowledgement_args[@]}")
          else
            result=$(python -m earnings_research.cli monitor-run \
              --registry "$REGISTRY" \
              --target-id "$TARGET_ID" \
              --fixture-dir tests/fixtures/monitor_offline \
              --fixture-name "$FIXTURE_NAME" \
              --previous-dir .monitor/previous \
              --output .monitor/current \
              --run-id "$run_id" \
              --started-at "$started_at" \
              --finished-at "$finished_at")
          fi
          artifact_name=$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["artifact_name"])')
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - id: upload
        if: steps.recheck.outputs.due == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.run-monitor.outputs.artifact_name }}
          path: .monitor/current/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Re-download uploaded artifact
        if: steps.recheck.outputs.due == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.run-monitor.outputs.artifact_name }}
          path: .monitor/reread
      - name: Verify re-downloaded committed state
        if: steps.recheck.outputs.due == 'true'
        run: python -m earnings_research.cli monitor-verify-bundle .monitor/reread
      - id: handoff
        name: Build autonomous research handoff
        if: steps.recheck.outputs.due == 'true'
        run: |
          result=$(python -m earnings_research.cli monitor-build-handoff \
            .monitor/reread \
            --output .monitor/handoff/research_handoff.json)
          required=$(printf '%s' "$result" | python -c 'import json,sys; print(str(json.load(sys.stdin)["handoff_required"]).lower())')
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - name: Preserve autonomous research handoff
        if: steps.handoff.outputs.required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ers-research-handoff-${{ matrix.monitor_target_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .monitor/handoff/research_handoff.json
          if-no-files-found: error
          retention-days: 14
      - id: analyze
        name: Analyze target earnings documents
        if: steps.handoff.outputs.required == 'true'
        # A failure here must not swallow the change notification, so the step is
        # allowed to fail and is re-surfaced after the Issue has been delivered.
        continue-on-error: true
        run: |
          mkdir -p .monitor/analysis
          python -m earnings_research.cli analyze-earnings-handoff \
            .monitor/handoff/research_handoff.json \
            --output-dir .monitor/analysis \
            --acquired-at "$(date --iso-8601=seconds)"
      - name: Preserve structured earnings analysis
        if: steps.handoff.outputs.required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ers-earnings-analysis-${{ matrix.monitor_target_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .monitor/analysis/
          if-no-files-found: warn
          retention-days: 14
      - id: notify
        if: always() && steps.run-monitor.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python -m earnings_research.cli monitor-notify \
            .monitor/reread \
            --repository "$REPOSITORY" \
            --receipt .monitor/notification/receipt.json \
            --recorded-at "$(date --iso-8601=seconds)"
      - name: Preserve notification receipt
        # Only when notification actually ran; a missing receipt then stays fatal.
        if: always() && steps.notify.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ers-monitor-notification-${{ matrix.monitor_target_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .monitor/notification/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Surface exhausted notification retry
        if: always() && steps.notify.outcome == 'failure'
        run: exit 1
      - name: Surface failed earnings analysis
        if: always() && steps.analyze.outcome == 'failure'
        run: exit 1
      - id: failure-notice
        name: Report a monitor job that produced no bundle
        # The regular notification needs a verified bundle, so a job that dies
        # before the monitor step would otherwise leave no Issue at all and the
        # stale threshold would be the only detector.
        if: failure() && steps.notify.outcome != 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_ID: ${{ matrix.monitor_target_id }}
          # The bundle exists when only Issue delivery failed, so the report
          # must not claim the run observed nothing.
          REASON: ${{ steps.notify.outcome == 'failure' && 'notification_failed' || 'no_bundle' }}
        run: |
          python -m earnings_research.cli monitor-notify-workflow-failure \
            --target-id "$TARGET_ID" \
            --repository "$REPOSITORY" \
            --receipt .monitor/notification/workflow_failure_receipt.json \
            --workflow-run-url "$RUN_URL" \
            --reason "$REASON" \
            --recorded-at "$(date --iso-8601=seconds)"
      - name: Preserve workflow failure receipt
        if: always() && steps.failure-notice.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ers-monitor-workflow-failure-${{ matrix.monitor_target_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .monitor/notification/workflow_failure_receipt.json
          if-no-files-found: warn
          retention-days: 14

  report-pipeline-failure:
    # The in-job report cannot run when the monitor job never started or was
    # cancelled, and those are exactly the cases where no target is observed at
    # all. Monitor-job failures are excluded so the two reports never duplicate.
    # An empty matrix is the ordinary "nothing is due today" outcome, so the
    # skipped case only counts when there was in fact something to observe.
    needs: [plan, monitor]
    if: >-
      always() &&
      (needs.plan.result != 'success' ||
       needs.monitor.result == 'cancelled' ||
       (needs.monitor.result == 'skipped' && needs.plan.outputs.matrix != '[]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9
      - run: pip install -e .
      - name: Report a monitoring workflow that observed nothing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m earnings_research.cli monitor-notify-workflow-failure \
            --target-id pipeline \
            --repository "$REPOSITORY" \
            --receipt .monitor/notification/pipeline_failure_receipt.json \
            --workflow-run-url "$RUN_URL" \
            --reason pipeline \
            --recorded-at "$(date --iso-8601=seconds)"
      - name: Preserve pipeline failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ers-monitor-pipeline-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .monitor/notification/pipeline_failure_receipt.json
          if-no-files-found: warn
          retention-days: 14
