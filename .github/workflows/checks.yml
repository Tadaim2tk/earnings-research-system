name: Checks

# 独立監査(2026-08-28)の指摘: このリポジトリには pytest を走らせるワークフローが
# 一本も無かった。ADRとdocstringは繰り返し「テストが守っている」「CIが強制する」と
# 書いているが、PRで実行されるのは Codex レビューゲートだけで、テストもレジストリ
# 検証もサンプル検証も誰も走らせていなかった。
#
# 拘束されていない規律はこのPRの中心的な失敗形であり、それを検出した監査の指摘自体が
# 同じ形で放置されているのは筋が通らない。ここで実行するのは、ADRが「強制される」と
# 主張している検査そのもの:
#   - 全テスト
#   - 凍結レジストリと、それが由来する研究知識との一致
#   - 後継レジストリが継承した停止規則を緩めていないこと(該当ファイルが動いたときのみ)
#   - committed 済みサンプルのスキーマ適合

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - run: python -m pip install -e ".[dev]"

      - name: Tests
        # pyproject already sets -q; passing it again reaches -qq and hides
        # the summary line, so a run's test count is invisible in the log.
        run: python -m pytest

      - name: Committed samples match their schemas
        run: python -m earnings_research.cli validate data/samples

      - name: The committed research outputs still match what generates them
        # Added because this PR turned it red and nothing noticed: stamping a
        # provenance notice onto files knowledge.py reproduces verbatim made
        # them mismatch by construction, while README tells the reader to run
        # this command and the suite stayed green.
        run: |
          python -m earnings_research.cli verify-legacy-research \
            --input-root data/historical_research/earnings_research_os/v1 \
            --output-dir outputs/historical_research

      - name: The published reports still match what the current code produces
        # The reports a reader actually opens — dashboard, weekly, note draft,
        # aggregation summary. They used to be generated only by
        # migrate-legacy-os, which needs the retired repository and a TSO
        # checkout at pinned commits; CI has neither, so nothing checked them.
        # They sat committed for weeks describing a pipeline that had already
        # been replaced, carrying figures measured from the previous close
        # while the code measured from the open. This rebuilds them from the
        # committed, hash-checked migration alone and refuses a mismatch.
        run: |
          python -m earnings_research.cli verify-legacy-reports \
            --input-root data/historical_research/earnings_research_os/v1 \
            --output-dir outputs/historical_research

      - name: The frozen registry still matches the research it came from
        run: |
          python -m earnings_research.cli verify-hypothesis-registry \
            --knowledge outputs/historical_research/research_knowledge.json \
            --registry data/prospective_hypotheses/legacy_research_v1.json

      - name: Frozen knowledge has been judged under the current contamination rules
        # Fails when the rules moved and nobody looked again, which is the
        # moment knowledge frozen earlier silently stops being supportable. It
        # does not write the ledger: the verdicts are produced by
        # evaluate-source-validity and committed, so a change of standard
        # arrives as a diff somebody reviews rather than as a file CI rewrote.
        #
        # Every registry in the directory, not one named path. Naming
        # legacy_research_v1.json meant a v2 could be frozen, never judged, and
        # merge with this step green — the standing check not covering the
        # newly frozen knowledge it exists for. Finding none is an error too:
        # a rename must not turn this step into a no-op that still reports
        # success.
        run: |
          set -euo pipefail
          registries=$(python - <<'PY'
          import json, pathlib
          for path in sorted(pathlib.Path("data/prospective_hypotheses").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              if {"registry_id", "hypotheses"} <= set(data):
                  print(path)
          PY
          )
          if [ -z "$registries" ]; then
            echo "::error::no hypothesis registry found under data/prospective_hypotheses/"
            exit 1
          fi
          verified=0
          for path in $registries; do
            echo "verifying $path"
            python -m earnings_research.cli verify-source-validity \
              --registry "$path" \
              --ledger data/prospective_hypotheses/source_validity.jsonl
            verified=$((verified + 1))
          done
          echo "verified $verified registries"

      - name: No decision rule changed after its hypothesis began gathering evidence
        # A stop rule says when a hypothesis is finished; a promotion rule says
        # when it has earned a production change. Once trials exist, neither
        # may move — tightening included, because a bar raised partway through
        # is still a bar moved in sight of the result.
        #
        # There are no committed trials yet, so today this passes over an empty
        # record. It is here now because that is the moment it costs nothing:
        # the first trial to land is the one that fixes a rule, and a check
        # added afterwards would be added with something already to lose. The
        # logic itself is exercised against a synthetic registry in
        # tests/unit/test_freeze.py, which CI runs above.
        run: |
          python -m earnings_research.cli verify-rule-freeze \
            --registry-dir data/prospective_hypotheses \
            --trials-dir data/prospective_hypotheses/trials

      - name: A successor registry retires nothing it inherited
        # Runs when the registry directory moved. A successor is by definition
        # a NEW file — the frozen one is never edited — so looking it up in the
        # base commit finds nothing, and the earlier form skipped exactly the
        # case it existed for: adding v2 with fourteen of nineteen hypotheses
        # dropped exited 0 without printing a word. It now finds the
        # predecessor by registry_id among the base's registries, and refuses
        # to be silent: every comparison it makes or declines is printed, and
        # anything it cannot resolve is an error rather than a skip.
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base=$(git rev-parse --verify --quiet 'HEAD~1^{commit}' || true)
          fi
          if [ -z "$base" ]; then
            echo "no predecessor commit to compare against"
            exit 0
          fi
          git cat-file -e "$base^{commit}"
          changed=$(git diff --name-only "$base" HEAD -- data/prospective_hypotheses/ || true)
          if [ -z "$changed" ]; then
            echo "registry untouched"
            exit 0
          fi
          workdir=$(mktemp -d)
          git ls-tree -r --name-only "$base" -- data/prospective_hypotheses/ \
            | grep '\.json$' > "$workdir/base_files" || true
          checked=0
          for path in $changed; do
            case "$path" in *.json) ;; *) continue ;; esac
            [ -f "$path" ] || { echo "$path was deleted"; exit 1; }
            id=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["registry_id"])' "$path")
            version=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["registry_version"])' "$path")
            previous=""
            best=0
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              git show "$base:$candidate" > "$workdir/candidate.json"
              read -r cid cversion < <(python -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["registry_id"],d["registry_version"])' "$workdir/candidate.json")
              if [ "$cid" = "$id" ] && [ "$cversion" -lt "$version" ] && [ "$cversion" -gt "$best" ]; then
                best=$cversion
                cp "$workdir/candidate.json" "$workdir/previous.json"
                previous="$workdir/previous.json"
              fi
            done < "$workdir/base_files"
            if [ -z "$previous" ]; then
              if [ "$version" -gt 1 ]; then
                echo "$path claims version $version but no earlier registry for $id exists in the base"
                exit 1
              fi
              echo "$path is version 1 of $id, nothing to compare against"
              continue
            fi
            echo "comparing $path (v$version) against $id v$best from the base"
            python -m earnings_research.cli verify-successor-registry \
              --previous-registry "$previous" --registry "$path"
            checked=$((checked + 1))
          done
          echo "compared $checked successor registries"
