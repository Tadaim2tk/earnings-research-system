name: Checks

# 独立監査(2026-08-28)の指摘: このリポジトリには pytest を走らせるワークフローが
# 一本も無かった。ADRとdocstringは繰り返し「テストが守っている」「CIが強制する」と
# 書いているが、PRで実行されるのは Codex レビューゲートだけで、テストもレジストリ
# 検証もサンプル検証も誰も走らせていなかった。
#
# 拘束されていない規律はこのPRの中心的な失敗形であり、それを検出した監査の指摘自体が
# 同じ形で放置されているのは筋が通らない。ここで実行するのは、ADRが「強制される」と
# 主張している検査そのもの:
#   - 全テスト
#   - 凍結レジストリと、それが由来する研究知識との一致
#   - 後継レジストリが継承した停止規則を緩めていないこと(該当ファイルが動いたときのみ)
#   - committed 済みサンプルのスキーマ適合

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Committed samples match their schemas
        run: python -m earnings_research.cli validate data/samples

      - name: The frozen registry still matches the research it came from
        run: |
          python -m earnings_research.cli verify-hypothesis-registry \
            --knowledge outputs/historical_research/research_knowledge.json \
            --registry data/prospective_hypotheses/legacy_research_v1.json

      - name: A successor registry only tightens its stop rules
        # Runs only when the registry directory moved. The predecessor is
        # whatever main holds, so widening a condition in a PR is caught by
        # comparison rather than by someone remembering to look.
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base=$(git rev-parse HEAD~1 2>/dev/null || true)
          if [ -z "$base" ]; then echo "no predecessor to compare against"; exit 0; fi
          if git diff --quiet "$base" HEAD -- data/prospective_hypotheses/; then
            echo "registry untouched"; exit 0
          fi
          previous=$(mktemp -d)/previous.json
          for path in $(git diff --name-only "$base" HEAD -- 'data/prospective_hypotheses/*.json'); do
            git show "$base:$path" > "$previous" 2>/dev/null || continue
            python -m earnings_research.cli verify-stop-rule-tightening \
              --previous-registry "$previous" --registry "$path"
          done
