name: Codex review gate

# レビュー到着前マージ事故(ERS #48, 2026-08-25: マージ4分後にCodexレビュー着=P1指摘2件が
# 「PRの修正」でなく「mainの負債」になり、後日PR #53で回収した)の構造対策。TSO #119と同型。
#
# 設計判断(2026-08-27改定, ERS-ADR-0040): ruleset "main-merge-gate" がこのcheckをmainの
# 必須チェックにしており、チェック完了前のマージはGitHub側で物理的に弾かれる。
# ADR-0039時点の「ボットがmainへ直接コミットするためrequired check化できない」という前提は
# 本リポジトリでは実態と異なった(mainへ直接pushするワークフローは無く、全コミットがPR経由)。
#
# 成功条件は「レビュー到着」ではなく「未解決のCodex指摘スレッドがゼロ」(TSO #121 Codex P1対応:
# 到着だけで緑にすると、--auto予約が指摘を読む前にマージしてしまう):
# - レビュー未着のままtimeout → 成功(fail-open: Codex停止で全マージを詰まらせない)
# - レビュー到着済みで未解決スレッドが残ったままtimeout → 失敗(赤)。修正をpushするか
#   スレッドをresolveすれば、synchronize/再実行で緑になる。
# checkの緑はレビュー精読の代わりにはならない — 届いたレビューを読む義務は手順側に残る。
#
# 2026-11-25 改定 (ERS-ADR-0084): このゲートは、二つのことを読み違えていた。
#
# 1. **「指摘なし」を読めていなかった。** Codex は指摘が無いときレビューを作らない。PR を開いた
#    ときの自動レビューでは、要約コメントを「completed・指摘なし」に書き換えるだけで、
#    `Reviewed commit` を含むコメント（ERS-ADR-0082 Amendment が数えることにした形）も付かない。
#    その形が付くのは、コメントで依頼したレビューのときだけである。PR #89 は、開いてから
#    1分24秒で Codex が読み終えていたのに、ゲートは20分待ち、`gate passes as a no-review PR`
#    で通した。
#    要約コメントの機械可読な状態（`codex-review-state:v1` の JSON）が **いまの head** を
#    completed・指摘なしと言っていれば、到着として数える。成功条件は変えていない。
# 2. **ゲートが書く依頼は、Codex に読まれていなかった。** ERS-ADR-0082 は push のたびに
#    ゲートが依頼のコメントを書くことにしたが、Codex は github-actions[bot] の依頼に
#    「Codex のアカウントを作って GitHub に接続してください」と返すだけで、レビューしない。
#    PR #82 で8回書いて8回ともそう返されている。届いたレビューは全部、人のアカウントからの
#    依頼へのものだった。**入れた日から一度も働いていない。** 依頼の手順は外す。
#    外すと、push された head は「誰も頼んでいない」ことになる。ERS-ADR-0082 Amendment の
#    決定（頼めていない回を fail-open で通さない）をそのまま当てて、push のあとに人の依頼が
#    無く、Codex が読み始めた跡も無いまま時間切れになったら赤にする。

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

# 続けて push すると `synchronize` の実行が重なる。古い方は自分の head SHA への
# レビューを待ち続けるが、**Codexが見るのは常に最新の head なので、その待ちは
# 満たされない。** 20分を消費して、古い head について結論を出すだけになる。
# PR単位で1本に絞り、古い方は畳む。
# 畳まれるのは古い commit の実行で、必須チェックが見るのは head の実行である。
concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait-for-codex-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 書き込み権限は持たない（workflow の `pull-requests: read` のまま）。ERS-ADR-0082 が
    # job 単位で write にしたのは依頼のコメントを書くためで、その手順はもう無い。
    env:
      # issue comments（ページごとの配列）を読み、Codex の要約コメントが **いまの head** に
      # ついて何と言っているかを1語で返す。
      #   clean    completed・指摘なし
      #   findings completed・指摘あり
      #   running  まだ結論が無い（実行中・待ち・失敗・結論の欄が空）
      #   none     要約が無い／読めない／別の commit を指している
      # 投稿者は Codex の Bot に限る。commit は40桁の完全一致で見る（短い SHA の部分一致で
      # 別の commit の結論を拾わない）。JSON が壊れていれば none で、緑にはしない。
      # tests/unit/test_review_gate_behavior.py が、この文字列をそのまま jq に渡して試す。
      SUMMARY_FILTER: |
        add // []
        | [ .[]
            | select((.user.login // "") == "chatgpt-codex-connector[bot]" and (.user.type // "") == "Bot")
            | (.body // "")
            | select(contains("codex-pull-request-review-summary"))
            | capture("codex-review-state:v1 (?<j>\\{.*\\}) -->")
            | (.j | try fromjson catch null)
            | select(type == "object")
            | .code_review
            | select(type == "object" and .commit_sha == $head)
          ] as $s
        | if ($s | length) == 0 then "none"
          elif any($s[]; .status == "completed" and .has_any_findings == true) then "findings"
          elif any($s[]; .status == "completed" and .has_any_findings == false) then "clean"
          else "running" end
      # push より後に、このリポジトリの人が書いたレビュー依頼の数。数えないもの:
      #   - Bot が書いたもの（このゲートがかつて書いていたものを含む）
      #   - リポジトリの外の人が書いたもの。public repository の PR には誰でもコメントできる。
      #     それを数えると、通りすがりの1行で「赤」を「fail-open で通す」へ変えられる。
      #     `author_association` が OWNER / MEMBER / COLLABORATOR のものだけを数える。
      #   - 文中で触れただけのもの
      #   - push より前のもの。前の head に向けた依頼である。
      REQUEST_FILTER: |
        add // []
        | [ .[]
            | select((.user.type // "") == "User")
            | (.author_association // "") as $who
            | select($who == "OWNER" or $who == "MEMBER" or $who == "COLLABORATOR")
            | select((.body // "") | test("^\\s*@codex\\s+review"; "i"))
            | select((.created_at // "") >= $since)
          ]
        | length
    steps:
      - name: Wait for Codex review with zero unresolved findings (max 20 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          # push の時刻。`synchronize` の event が運ぶ PR の `updated_at` がそれに当たる
          # （再実行でも同じ値が渡る）。これ以降に人が書いた依頼を数える。
          PUSHED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          owner="${REPO%%/*}"
          name="${REPO##*/}"
          arrived=0
          summary_findings=0
          summary_running=0
          # この実行が、何の event で、どの head を、いつの push として見ているか。
          # あとから結論を検算できるように、最初に書いておく。
          echo "event=${EVENT_ACTION:-} draft=${IS_DRAFT:-} head=$HEAD_SHA pushed_at=${PUSHED_AT:-}"
          if ! command -v jq >/dev/null 2>&1; then
            # 要約と依頼の読み取りは jq に通す。無ければどちらも読めず、下は「読めない」側へ倒れる
            # （要約は none、依頼は unknown）。黙ってそうならないように、理由を先に言う。
            echo "::warning::jq is not on this runner, so Codex's summary comment and the review requests cannot be read."
          fi
          # **指摘が無いとき、Codexはレビューではなく普通のコメントで返す。**
          # 2026-09-06 実測: PR #82 は `Codex Review: Didn't find any major issues.`
          # を issue comment として投稿し、`pulls/N/reviews` には何も現れなかった。
          # レビューだけを数えていると **きれいなPRは必ず「レビュー未着」になり、
          # fail-open で通る。**「Codexが止まっている」と「見て問題なかった」が
          # 区別できない。どちらの形も本文に `Reviewed commit: <sha>` を持つので、
          # 現在の head を名指すボットのコメントも到着として数える。
          short="${HEAD_SHA:0:10}"
          for i in $(seq 1 40); do
            # レビューは現在のhead SHAに対するものだけを数える(古いレビューでの即グリーン防止)。
            n=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select(.user.login==\"chatgpt-codex-connector[bot]\" and .commit_id==\"$HEAD_SHA\")] | length" \
              2>/dev/null | awk '{s+=$1} END {print s+0}')
            # コメント側も現在の head を名指すものだけ数える。古い回の文言で
            # 即グリーンにしないため、レビュー側と同じ条件にそろえる。
            c=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
              --jq "[.[] | select(.user.login==\"chatgpt-codex-connector[bot]\") | select(.body | contains(\"Reviewed commit\")) | select(.body | contains(\"$short\"))] | length" \
              2>/dev/null | awk '{s+=$1} END {print s+0}')
            # **PR を開いたときの自動レビューは、上のどちらの形でも返らない。** 指摘が無ければ
            # 要約コメントを書き換えるだけである（2026-11-17 実測: PR #89）。要約も読む。
            summary_state=$( (gh api --paginate "repos/$REPO/issues/$PR/comments" 2>/dev/null \
              | jq -rs --arg head "$HEAD_SHA" "$SUMMARY_FILTER" 2>/dev/null) || true)
            case "$summary_state" in clean|findings|running) ;; *) summary_state="none" ;; esac
            # 一度でも「いまの head に指摘あり」「いまの head を読んでいる」を見たら、あとの周回で
            # 読めなくなっても忘れない。最後の周だけ取得に失敗して、見たはずのものを無かったことに
            # しないため。
            if [ "$summary_state" = "findings" ]; then
              summary_findings=1
            fi
            if [ "$summary_state" = "running" ]; then
              summary_running=1
            fi
            # `Reviewed commit` のコメントは、要約がこの head について何も言っていないときだけ数える。
            # 要約が「指摘あり」「まだ読んでいる」と言っているのに、同じ head への古い受領コメントで
            # 通さない（同じ head を読み直させている最中に、前の回の結論で緑にしない）。
            if [ "$summary_state" != "none" ]; then
              c=0
            fi
            if [ "$n" -gt 0 ] || [ "$c" -gt 0 ] || [ "$summary_state" = "clean" ]; then
              arrived=1
              # 未解決のCodex指摘スレッド数。コミットを跨いで数える(古い未処理指摘も塞ぐ)。
              # GraphQL失敗時は unknown のまま待ち続け、最終的に赤に倒す(安全側)。
              unresolved=$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:1){nodes{author{login}}}}}}}}' \
                -f owner="$owner" -f name="$name" -F number="$PR" \
                --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved|not) | select((.comments.nodes[0].author.login // "") | startswith("chatgpt-codex-connector"))] | length' \
                2>/dev/null || echo "unknown")
              if [ "$unresolved" = "0" ]; then
                if [ "$n" -gt 0 ] || [ "$c" -gt 0 ]; then
                  echo "Codex review arrived ($((n + c)) review(s)) and no unresolved finding threads remain."
                  echo "### Codex review gate: レビュー済み・未解決の指摘なし" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "Codex reviewed this head and reported no findings (summary comment); no unresolved finding threads remain."
                  echo "### Codex review gate: レビュー済み・指摘なし（要約コメントが、いまの head を completed・指摘なしと報告）" >> "$GITHUB_STEP_SUMMARY"
                fi
                exit 0
              fi
              echo "Codex review arrived; unresolved finding threads: $unresolved — address them in this PR. ($i/40)"
            elif [ "$summary_state" = "findings" ]; then
              # 要約は「いまの head に指摘あり」と言っているが、レビュー（指摘スレッド）がまだ見えない。
              # 遅れて届くことがあるので待つ。最後まで見えなければ赤にする（fail-open で通さない）。
              echo "Codex's summary reports findings for this head, but no review is visible yet. ($i/40)"
            elif [ "$summary_state" = "running" ]; then
              echo "Codex is reviewing this head. ($i/40)"
            else
              echo "waiting for Codex review... ($i/40)"
            fi
            sleep 30
          done
          if [ "$arrived" -gt 0 ]; then
            echo "::error::Codex findings are still unresolved after 20 min. Push a fix and/or resolve the threads, then re-run this check."
            exit 1
          fi
          if [ "$summary_findings" -gt 0 ]; then
            # 指摘があると分かっている head を、fail-open で通さない。
            echo "::error::Codex's summary comment reports findings for this head, but no review thread could be read. Read Codex's comments on this pull request; push a fix, or re-run this check once the findings are visible."
            exit 1
          fi
          if [ "$summary_running" -gt 0 ]; then
            # Codex はこの head を読み始めていた。頼まれていないのではなく、終わらなかった。
            # Codex 側の停止なので、fail-open の対象である。
            echo "Codex started reviewing this head but did not finish within 20 min — gate passes as a no-review PR."
            {
              echo "### Codex review gate: **レビュー無しで通過（fail-open）** — Codex は読み始めたが、20分で終わらなかった"
              echo ""
              echo "この緑は「レビュー済み・指摘なし」を意味しない。あとから指摘が付くことがある。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${EVENT_ACTION:-}" = "synchronize" ] && [ "${IS_DRAFT:-}" != "true" ]; then
            # **push では Codex は動かない。** 動くのは「PRを開いた」「draftをreadyにした」
            # 「レビュー依頼のコメントが書かれた」の3つで、依頼は Codex に接続した人のアカウントから
            # でないと通らない（このゲートが書いた依頼は読まれなかった。ERS-ADR-0084）。
            # だから push された head は、人が頼んでいなければ「レビューが来なかった」ではなく
            # 「レビューを求めていない」である。fail-open は Codex 側の停止のための逃げ道で、
            # **こちらが頼んでいない場合に使うものではない**（ERS-ADR-0082 Amendment）。
            #
            # draft は対象にしない。書きかけへの push のたびに赤くしても、直す相手がいない。
            # draft を見てもらう場所は `ready_for_review` で、そこは Codex 自身が発火する。
            requested="unknown"
            if comments_json=$(gh api --paginate "repos/$REPO/issues/$PR/comments" 2>/dev/null) && [ -n "$comments_json" ]; then
              requested=$(printf '%s' "$comments_json" \
                | jq -rs --arg since "${PUSHED_AT:-}" "$REQUEST_FILTER" 2>/dev/null) || requested="unknown"
            fi
            case "$requested" in ''|*[!0-9]*) requested="unknown" ;; esac
            if [ "$requested" = "unknown" ]; then
              # 依頼があったかどうかを読めなかった。読めないものを「頼んであった」にはしない(安全側)。
              echo "::error::Could not read this pull request's comments, so the gate cannot tell whether anyone asked Codex to review this pushed head. Pushes do not trigger Codex on their own. Re-run this check."
              exit 1
            fi
            if [ "$requested" -eq 0 ]; then
              echo "::error::No one asked Codex to review this pushed head (no request at or after ${PUSHED_AT:-the push}), and pushes do not trigger Codex on their own. Comment \"@codex review\" on this pull request from an account connected to Codex, then re-run this check."
              {
                echo "### Codex review gate: **赤 — push された head を、誰もレビューに出していない**"
                echo ""
                echo "Codex は push では動かない。この head (${HEAD_SHA:0:10}) は、push (${PUSHED_AT:-時刻不明}) のあと誰も依頼していないので、読まれていない。"
                echo "Codex に接続した人のアカウントからレビュー依頼のコメントを書き、この check を再実行する。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "review requests by people since the push: $requested"
          fi
          echo "No Codex review within 20 min — gate passes as a no-review PR."
          {
            echo "### Codex review gate: **レビュー無しで通過（fail-open）** — Codex が動くはずの場面で、20分たっても何も来なかった"
            echo ""
            echo "この緑は「レビュー済み・指摘なし」を意味しない。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
