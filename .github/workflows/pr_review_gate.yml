name: Codex review gate

# レビュー到着前マージ事故(ERS #48, 2026-08-25: マージ4分後にCodexレビュー着=P1指摘2件が
# 「PRの修正」でなく「mainの負債」になり、後日PR #53で回収した)の構造対策。TSO #119と同型。
#
# 設計判断(2026-08-27改定, ERS-ADR-0040): ruleset "main-merge-gate" がこのcheckをmainの
# 必須チェックにしており、チェック完了前のマージはGitHub側で物理的に弾かれる。
# ADR-0039時点の「ボットがmainへ直接コミットするためrequired check化できない」という前提は
# 本リポジトリでは実態と異なった(mainへ直接pushするワークフローは無く、全コミットがPR経由)。
#
# 成功条件は「レビュー到着」ではなく「未解決のCodex指摘スレッドがゼロ」(TSO #121 Codex P1対応:
# 到着だけで緑にすると、--auto予約が指摘を読む前にマージしてしまう):
# - レビュー未着のままtimeout → 成功(fail-open: Codex停止で全マージを詰まらせない)
# - レビュー到着済みで未解決スレッドが残ったままtimeout → 失敗(赤)。修正をpushするか
#   スレッドをresolveすれば、synchronize/再実行で緑になる。
# checkの緑はレビュー精読の代わりにはならない — 届いたレビューを読む義務は手順側に残る。

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

# 続けて push すると `synchronize` の実行が重なる。古い方は自分の head SHA への
# レビューを待ち続けるが、**Codexが見るのは常に最新の head なので、その待ちは
# 満たされない。** 20分の fail-open を消費するだけで、依頼を投げる側になった今は
# 限りある枠まで無駄に使う。PR単位で1本に絞り、古い方は畳む。
# 畳まれるのは古い commit の実行で、必須チェックが見るのは head の実行である。
concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait-for-codex-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pull-requests: write
    steps:
      - id: ask
        name: Ask Codex to review this head
        # Codexが動くのは「PRを開いた」「draftをreadyにした」「@codex review と
        # 書いた」の3つだけで、**pushは入っていない**（レビュー本文が明示している）。
        # 待つだけの実装では、指摘を直してpushするほどレビューは来なくなり、
        # 20分後のfail-openで緑になる。**直すほどゲートが形骸化していた。**
        #
        # 2026-09-06 実測: PR #80/#81 とも push 後にレビューが来ず
        # `No Codex review within 20 min` で通過。コメントで呼ぶと2分で届いた。
        #
        # 呼ぶのは synchronize のときだけにする。opened / reopened /
        # ready_for_review は Codex 自身の発火条件なので、重ねて呼ぶと同じ head を
        # 二度レビューさせ、利用上限を余計に使う。
        if: github.event.action == 'synchronize'
        # 呼べなくても待つ側は動く。上限に当たったときに、ここで赤くしない。
        # ただし**呼べなかったことは覚えておく**。fork や Dependabot からのPRでは
        # `GITHUB_TOKEN` が job 単位の permissions によらず読み取り専用になり、
        # この POST は 403 で落ちる。黙って落として fail-open へ流すと、
        # **一度も呼んでいないのに「Codexが止まっている」扱いで通ってしまう。**
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 畳まれる前に走り出した実行が残ることがある。**依頼のコメントは
          # commit を名指さないので、古い実行が投げると最新の head が
          # レビューされ、その実行は自分の SHA を待ち続ける。** 投げる直前に
          # 現在の head と突き合わせ、ずれていたら投げない。
          live=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "head moved from $HEAD_SHA to $live; the newer run owns the request."
            exit 0
          fi
          gh api "repos/$REPO/issues/$PR/comments" -f body='@codex review' --silent
      - name: Wait for Codex review with zero unresolved findings (max 20 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASK_OUTCOME: ${{ steps.ask.outcome }}
        run: |
          owner="${REPO%%/*}"
          name="${REPO##*/}"
          arrived=0
          # **指摘が無いとき、Codexはレビューではなく普通のコメントで返す。**
          # 2026-09-06 実測: PR #82 は `Codex Review: Didn't find any major issues.`
          # を issue comment として投稿し、`pulls/N/reviews` には何も現れなかった。
          # レビューだけを数えていると **きれいなPRは必ず「レビュー未着」になり、
          # fail-open で通る。**「Codexが止まっている」と「見て問題なかった」が
          # 区別できない。どちらの形も本文に `Reviewed commit: <sha>` を持つので、
          # 現在の head を名指すボットのコメントも到着として数える。
          short="${HEAD_SHA:0:10}"
          for i in $(seq 1 40); do
            # レビューは現在のhead SHAに対するものだけを数える(古いレビューでの即グリーン防止)。
            n=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select(.user.login==\"chatgpt-codex-connector[bot]\" and .commit_id==\"$HEAD_SHA\")] | length" \
              2>/dev/null | awk '{s+=$1} END {print s+0}')
            # コメント側も現在の head を名指すものだけ数える。古い回の文言で
            # 即グリーンにしないため、レビュー側と同じ条件にそろえる。
            c=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
              --jq "[.[] | select(.user.login==\"chatgpt-codex-connector[bot]\") | select(.body | contains(\"Reviewed commit\")) | select(.body | contains(\"$short\"))] | length" \
              2>/dev/null | awk '{s+=$1} END {print s+0}')
            n=$((n + c))
            if [ "$n" -gt 0 ]; then
              arrived=1
              # 未解決のCodex指摘スレッド数。コミットを跨いで数える(古い未処理指摘も塞ぐ)。
              # GraphQL失敗時は unknown のまま待ち続け、最終的に赤に倒す(安全側)。
              unresolved=$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:1){nodes{author{login}}}}}}}}' \
                -f owner="$owner" -f name="$name" -F number="$PR" \
                --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved|not) | select((.comments.nodes[0].author.login // "") | startswith("chatgpt-codex-connector"))] | length' \
                2>/dev/null || echo "unknown")
              if [ "$unresolved" = "0" ]; then
                echo "Codex review arrived ($n review(s)) and no unresolved finding threads remain."
                exit 0
              fi
              echo "Codex review arrived; unresolved finding threads: $unresolved — address them in this PR. ($i/40)"
            else
              echo "waiting for Codex review... ($i/40)"
            fi
            sleep 30
          done
          if [ "$ASK_OUTCOME" = "failure" ]; then
            # **一度も呼べていない。** fork や Dependabot からのPRでは
            # `GITHUB_TOKEN` が読み取り専用になり、依頼の POST が 403 で落ちる。
            # push では Codex は動かないので、呼べなかった回は「レビューが
            # 来なかった」ではなく「レビューを求めていない」である。
            # fail-open は Codex 側の停止のための逃げ道で、**こちらの手が
            # 届かなかった場合に使うものではない。**
            echo "::error::Could not ask Codex for a review (the token is read-only on fork and Dependabot pull requests), and pushes do not trigger Codex on their own. Comment \"@codex review\" on this pull request, then re-run this check."
            exit 1
          fi
          if [ "$arrived" -gt 0 ]; then
            echo "::error::Codex findings are still unresolved after 20 min. Push a fix and/or resolve the threads, then re-run this check."
            exit 1
          fi
          echo "No Codex review within 20 min — gate passes as a no-review PR."
