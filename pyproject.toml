[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-research-system"
version = "0.1.0"
description = "Append-only earnings expectation and reaction research foundation for future TSO integration."
requires-python = ">=3.11"
dependencies = [
  "httpcore>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
