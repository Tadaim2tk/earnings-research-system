[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-research-system"
version = "0.1.0"
description = "Append-only earnings expectation and reaction research foundation for future TSO integration."
requires-python = ">=3.11"
dependencies = [
  "httpcore>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  # `import pymupdf` (the lowercase module) only exists from 1.24.3.
  "PyMuPDF>=1.24.3,<2.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# 退役済み史料の研究でだけ使う。前向き運用の経路には入らないので、
# 本体の依存にはしない。
research = [
  "yfinance>=0.2,<1.0",
]
dev = [
  # The tests import this directly; it was reaching them only as somebody
  # else's transitive dependency, which a clean CI checkout does not have.
  "jsonschema>=4.0",
  "pytest>=7.0",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
